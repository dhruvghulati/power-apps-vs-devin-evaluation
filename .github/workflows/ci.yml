name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: API smoke against production build
        run: |
          npm start & pid=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ -o /dev/null && break || sleep 1; done
          BASE=http://localhost:3000 scripts/smoke.sh
          kill $pid
